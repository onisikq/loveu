  <!-- Добавьте эти строки в <head> вашего index.html (сразу после существующих ссылок) -->
<style>

  .story-item[data-aos="fade-right"] {

  <!-- В index.html добавьте еще одну вкладку в секцию навигации -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши 10 лучших моментов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- В <body> добавьте кнопку: -->
<button id="musicToggle" style="position: fixed; bottom: 20px; right: 20px; 
background: #ff6b6b; color: white; border: none; width: 40px; 
height: 40px; border-radius: 50%; cursor: pointer;">♪</button>

<script>
   
const music = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggle");

toggleBtn.addEventListener("click", () => {
if (music.paused) {
music.play();
toggleBtn.textContent = "♫";
} else {
music.pause();
toggleBtn.textContent = "♪";
}
});
</script>
<button onclick="showRandomVideo()" class="action-btn">Случайное видео</button>
<button onclick="showRandomMemory()" class="action-btn" style="bottom: 70px;">Случайное фото</button>

    <div class="page-wrapper">
        <div class="container">
            <header class="centered-block">
                <!-- В раздел <header> добавьте: -->
<div id="love-timer" style="margin: 15px 0; font-size: 1.2em;"></div>
<div class="calendar">
    <h3>Наши важные даты</h3>
    <ul id="important-dates" style="list-style: none; padding: 0;">
      <li>30.12.2024 - Начали встречаться ❤️</li>
      <!-- Добавьте другие даты -->
    </ul>
  </div>
  
  <style>
    .calendar {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin: 20px auto;
      max-width: 500px;
      transition: background-color 0.5s ease, color 0.5s ease, box-shadow 0.5s ease;
    }
    
    .dark-theme .calendar {
      background: #252538;
      color: #e6e6e6;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    #important-dates li {
      padding: 8px;
      border-bottom: 1px dashed #eee;
      transition: background-color 0.3s ease;
    }
    
    .dark-theme #important-dates li {
      border-bottom: 1px dashed #444;
    }
    
    #important-dates li:hover {
      background: #fff5f5;
    }
    
    .dark-theme #important-dates li:hover {
      background: #333355;
    }
  </style>

<script>
  // Расчет дней вместе
  const startDate = new Date("2024-12-30"); // Ваша дата
  
  function updateLoveTimer() {
    const diff = Math.floor((new Date() - startDate) / (1000*60*60*24));
    const years = Math.floor(diff / 365);
    const days = diff % 365;
    
    document.getElementById("love-timer").innerHTML = `
      Вместе уже: <br>
      <span style="color: #ff6b6b; font-weight: bold;">
        ${years} ${years === 1 ? 'год' : years < 5 ? 'года' : 'лет'} 
        и ${days} ${days === 1 ? 'день' : days < 5 ? 'дня' : 'дней'}
      </span>
    `;
  }
  
  setInterval(updateLoveTimer, 86400000); // Обновлять ежедневно
  updateLoveTimer(); // Запустить сразу
</script>
                <h1>10 счастливых мгновений ❤️</h1>
                <p>Кликайте на фото, чтобы увидеть историю</p>

            <!-- Добавляем навигацию -->
